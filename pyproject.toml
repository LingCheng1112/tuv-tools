[project]
name = "tuv-tools"
version = "0.1.0"
description = "TUV 测试文档自动化工具集"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "requests>=2.28.0",
    "pycryptodome>=3.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
tuv-tools = "tuv_tools.app:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
